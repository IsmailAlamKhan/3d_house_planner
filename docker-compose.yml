# Duplex Designer — everything with one command:   docker compose up -d
# Needs Docker Desktop (WSL2 backend) and, for the GPU, a current NVIDIA driver on Windows.
# Settings come from .env (copy .env.example): PORT, OLLAMA_MODEL, APP_PASSWORD.

services:
  app:
    build: .
    image: duplex-designer:local
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Optional "Enhance render" service (profile "render"); when it is not running the app says how to start it.
      COMFYUI_URL: http://comfyui:8188
    volumes:
      - app-data:/data
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    # No "ports": Ollama is reachable only from the app on the internal compose network, never from the LAN.
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Downloads the model once (into the ollama-data volume) and exits. The app already works while this runs: it falls
  # back to the built-in offline generator and shows "Downloading the AI model…".
  ollama-init:
    image: ollama/ollama:0.12.3
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:14b}"]

  # ── Optional: AI image enhancement (ComfyUI + Stable Diffusion XL + ControlNet) ───────────────────────────────────
  # Start with:  docker compose --profile render up -d      (about 12 GB of models are downloaded once)
  # The language model and the image model do not fit on a 16 GB GPU together: the app server runs both kinds of job
  # one at a time and unloads the other model first.
  comfyui:
    profiles: ["render"]
    build: ./docker/comfyui
    image: duplex-designer-comfyui:local
    restart: unless-stopped
    # No "ports": reachable only from the app on the internal compose network.
    volumes:
      - comfyui-models:/models
    depends_on:
      comfyui-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  comfyui-init:
    profiles: ["render"]
    image: alpine:3.20.3
    restart: "no"
    volumes:
      - comfyui-models:/models
      - ./docker/comfyui/download-models.sh:/download-models.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && sh /download-models.sh"]

volumes:
  app-data:
  ollama-data:
  comfyui-models:
