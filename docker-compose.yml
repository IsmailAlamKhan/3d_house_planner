# Duplex Designer — everything with one command:   docker compose up -d
# Needs Docker Desktop (WSL2 backend) and, for the GPU, a current NVIDIA driver on Windows.
# Settings come from .env (copy .env.example): PORT, OLLAMA_MODEL, APP_PASSWORD.

services:
  app:
    build: .
    image: duplex-designer:local
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:8b-instruct}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # AI image enhancement ("Enhance with AI"): ComfyUI below, on the internal network only.
      # The image service: your own ComfyUI on this PC by default (see .env), or the one in this file (profile `comfyui`).
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
      # Studio render (Blender Cycles): the `blender` service below, started with  docker compose --profile render up -d
      BLENDER_URL: http://blender:9000
      WHISPER_URL: http://whisper:8080
    # lets the app reach a ComfyUI running on the host (http://host.docker.internal:8188)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/data
      # the CC0 model / texture / sky pack, filled by assets-init below (the app works without it, on built-in models)
      - assets-pack:/assets/pack:ro
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.7
    restart: unless-stopped
    # No "ports": Ollama is reachable only from the app on the internal compose network, never from the LAN.
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Downloads the model once (into the ollama-data volume) and exits. The app already works while this runs: it falls
  # back to the built-in offline generator and shows "Downloading the AI model…".
  ollama-init:
    image: ollama/ollama:0.40.7
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:8b-instruct}
    # The text model first (the app already works with it), then the picture-reading model.
    entrypoint:
      - sh
      - -c
      - ollama pull "${OLLAMA_MODEL:-qwen3:14b}" && ollama pull "${OLLAMA_VISION_MODEL:-qwen3-vl:8b-instruct}"

  # Downloads the free CC0 asset pack (real 3D models, PBR textures, HDRI skies; about 300 MB, converted to compact files)
  # once into the assets-pack volume and exits. The app already works while this runs, on its built-in models; reload
  # the page when it is done. Licences: assets/LICENSES.md. Watch it with:  docker compose logs -f assets-init
  assets-init:
    build:
      context: .
      target: assets
    image: duplex-designer-assets:local
    restart: "no"
    volumes:
      - assets-pack:/app/assets/pack
      - assets-cache:/app/assets/.cache

  # ── AI image enhancement (ComfyUI + Stable Diffusion XL + ControlNet), started by the same "docker compose up -d" ──
  # The first start downloads about 12 GB of models once (comfyui-init); until then the app says the image service is
  # still starting and everything else already works. Watch it with:  docker compose logs -f comfyui-init
  # The language model and the image model do not fit on a 16 GB GPU together: the app server runs both kinds of job
  # one at a time and unloads the other model first.
  comfyui:
    # Optional: only started with  docker compose --profile comfyui up -d  (about 27 GB of images and models on the Docker disk).
    # If ComfyUI is already installed on this PC, set COMFYUI_URL in .env and skip this service.
    profiles: ["comfyui"]
    build: ./docker/comfyui
    image: duplex-designer-comfyui:local
    restart: unless-stopped
    # No "ports": reachable only from the app on the internal compose network.
    volumes:
      - comfyui-models:/models
    # No depends_on: the container starts at once and waits for the models itself (docker/comfyui/start.sh), so
    # "docker compose up -d" returns immediately even on the first start.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Studio render: Blender 4.2 LTS + Cycles on the GPU (OptiX), started by  docker compose --profile render up -d ──
  # Not part of a plain "docker compose up -d": without it the app works and explains how to turn Studio render on.
  # No "ports": reachable only from the app. It shares the app's data folder (bundles and results) and the asset pack (HDRI skies).
  blender:
    profiles: ["render"]
    build:
      context: .
      dockerfile: docker/blender/Dockerfile
    image: duplex-designer-blender:local
    restart: unless-stopped
    volumes:
      - app-data:/data
      - assets-pack:/assets/pack:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Voice input: whisper.cpp (GPU), started by  docker compose --profile voice up -d  ──
  # English and Bengali speech to text for the microphone button. Not part of a plain "docker compose up -d".
  whisper:
    profiles: ["voice"]
    build: ./docker/whisper
    image: duplex-designer-whisper:local
    restart: unless-stopped
    volumes:
      - whisper-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  comfyui-init:
    profiles: ["comfyui"]
    image: alpine:3.20.3
    restart: "no"
    volumes:
      - comfyui-models:/models
      - ./docker/comfyui/download-models.sh:/download-models.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && sh /download-models.sh"]

volumes:
  app-data:
  assets-pack:
  assets-cache:
  ollama-data:
  comfyui-models:
  whisper-models:
